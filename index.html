<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Quote</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; background: #fafafa; margin: 0; padding: 2rem; }
    .card { background: #fff; border-radius: 8px; padding: 1.5rem; max-width: 500px; margin: auto; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .quote { font-size: 1.4rem; line-height: 1.5; margin-bottom: 1rem; }
    .author { font-weight: bold; text-align: right; }
    button { margin-top: 1rem; margin-right: 0.5rem; padding: 0.5rem 1rem; border: none; border-radius: 4px; background: #007bff; color: #fff; cursor: pointer; }
    button:hover { background: #0056b3; }
    #favorites { max-width: 500px; margin: 2rem auto 0; }
    #favorites h2 { font-size: 1.2rem; margin-bottom: 0.5rem; }
    #favorites ul { list-style: none; padding: 0; }
    #favorites li { background: #fff; padding: 0.75rem; border-radius: 6px; margin-bottom: 0.5rem; box-shadow: 0 1px 4px rgba(0,0,0,0.06); display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
    .remove-btn { margin: 0; background: #dc3545; padding: 0.25rem 0.6rem; font-size: 0.85rem; }
    .remove-btn:hover { background: #a71d2a; }
  </style>
</head>
<body>

<div class="card">
  <div id="quote" class="quote">Loading...</div>
  <div id="author" class="author"></div>
  <button id="newQuote">New Quote</button>
  <button id="saveFav">Save Favorite</button>
</div>

<div id="favorites">
  <h2>Favorites</h2>
  <ul id="favList"></ul>
</div>

<script>
  const quoteEl = document.getElementById('quote');
  const authorEl = document.getElementById('author');
  const newBtn = document.getElementById('newQuote');
  const saveBtn = document.getElementById('saveFav');
  const favList = document.getElementById('favList');
  const STORAGE_KEY = 'dailyQuoteFavs';

  let currentQuote = {};

  async function fetchQuote() {
    quoteEl.textContent = 'Loading...';
    authorEl.textContent = '';
    try {
      const res = await fetch('https://dummyjson.com/quotes/random');
      if (!res.ok) throw new Error('Network error');
      const data = await res.json();
      currentQuote = { quote: data.quote, author: data.author };
      quoteEl.textContent = `"${currentQuote.quote}"`;
      authorEl.textContent = `— ${currentQuote.author}`;
    } catch (err) {
      quoteEl.textContent = 'Failed to load quote. Check your connection and try again.';
    }
  }

  function getFavorites() {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  }

  function renderFavorites() {
    const favs = getFavorites();
    favList.innerHTML = '';
    favs.forEach((item, index) => {
      const li = document.createElement('li');
      li.innerHTML = `<span>"${item.quote}" — <strong>${item.author}</strong></span>`;
      
      const delBtn = document.createElement('button');
      delBtn.textContent = 'Remove';
      delBtn.className = 'remove-btn';
      delBtn.onclick = () => {
        favs.splice(index, 1);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(favs));
        renderFavorites();
      };

      li.appendChild(delBtn);
      favList.appendChild(li);
    });
  }

  saveBtn.addEventListener('click', () => {
    if (!currentQuote.quote) return;
    const favs = getFavorites();
    const exists = favs.some(f => f.quote === currentQuote.quote);
    if (!exists) {
      favs.push(currentQuote);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(favs));
      renderFavorites();
    }
  });

  newBtn.addEventListener('click', fetchQuote);

  // Initialize on page load
  renderFavorites();
  fetchQuote();
</script>

</body>
</html>
