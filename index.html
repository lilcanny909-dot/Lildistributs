<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Quote — Glass Edition</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      min-height: 100vh;
      padding: 2rem 1rem 3rem;
      color: #f8fafc;
      background:
        radial-gradient(circle at 12% 18%, rgba(6, 182, 212, 0.45), transparent 42%),
        radial-gradient(circle at 88% 15%, rgba(16, 185, 129, 0.4), transparent 45%),
        radial-gradient(circle at 80% 85%, rgba(245, 158, 11, 0.35), transparent 45%),
        radial-gradient(circle at 20% 85%, rgba(37, 99, 235, 0.5), transparent 48%),
        linear-gradient(135deg, #060b14 0%, #0b1628 50%, #071921 100%);
      background-attachment: fixed;
      overflow-x: hidden;
    }

    /* Decorative glowing glass orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(55px);
      z-index: 0;
      pointer-events: none;
    }
    .orb-1 {
      width: 240px;
      height: 240px;
      top: 6%;
      left: -50px;
      background: rgba(6, 182, 212, 0.4);
    }
    .orb-2 {
      width: 270px;
      height: 270px;
      bottom: 8%;
      right: -60px;
      background: rgba(16, 185, 129, 0.35);
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 540px;
      margin: auto;
    }

    .glass {
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.14),
        rgba(255, 255, 255, 0.04)
      );
      backdrop-filter: blur(18px) saturate(160%);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-top-color: rgba(255, 255, 255, 0.45);
      border-left-color: rgba(255, 255, 255, 0.35);
      box-shadow:
        0 14px 35px rgba(0, 0, 0, 0.45),
        inset 0 1px 1px rgba(255, 255, 255, 0.3);
    }

    .card {
      border-radius: 20px;
      padding: 1.75rem;
    }

    .badge {
      display: inline-block;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.3rem 0.75rem;
      border-radius: 999px;
      background: rgba(6, 182, 212, 0.18);
      border: 1px solid rgba(6, 182, 212, 0.45);
      margin-bottom: 1rem;
      color: #67e8f9;
      font-weight: bold;
    }

    .quote {
      font-size: 1.35rem;
      line-height: 1.55;
      margin-bottom: 1rem;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
    }

    .author {
      font-weight: bold;
      text-align: right;
      color: #34d399;
      margin-bottom: 1.25rem;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
    }

    button {
      padding: 0.6rem 1.05rem;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 12px;
      color: #ffffff;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: transform 0.15s ease, filter 0.15s ease, box-shadow 0.15s ease;
    }

    button:hover {
      transform: translateY(-2px);
      filter: brightness(1.15);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
    }

    button:active {
      transform: translateY(0);
    }

    .btn-primary {
      background: linear-gradient(135deg, rgba(6, 182, 212, 0.7), rgba(37, 99, 235, 0.7));
    }

    .btn-fav {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.65), rgba(5, 150, 105, 0.75));
    }

    .btn-notify {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.7), rgba(217, 119, 6, 0.75));
    }

    .btn-notify.active {
      background: linear-gradient(135deg, rgba(20, 184, 166, 0.8), rgba(13, 148, 136, 0.85));
      border-color: rgba(94, 234, 212, 0.7);
    }

    .status-bar {
      margin-top: 0.9rem;
      font-size: 0.85rem;
      color: #cbd5e1;
      min-height: 1.2em;
    }

    #favorites {
      margin-top: 2rem;
    }

    #favorites h2 {
      font-size: 1.2rem;
      margin-bottom: 0.75rem;
      color: #e2e8f0;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
    }

    #favorites ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    #favorites li {
      border-radius: 14px;
      padding: 0.85rem 1rem;
      margin-bottom: 0.65rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .fav-text {
      line-height: 1.4;
      font-size: 0.95rem;
    }

    .remove-btn {
      flex-shrink: 0;
      padding: 0.35rem 0.75rem;
      font-size: 0.82rem;
      background: linear-gradient(135deg, rgba(220, 38, 38, 0.7), rgba(153, 27, 27, 0.75));
    }

    /* In-app toast fallback */
    .toast {
      position: fixed;
      bottom: 1.25rem;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      opacity: 0;
      pointer-events: none;
      z-index: 50;
      max-width: 92vw;
      width: 440px;
      border-radius: 16px;
      padding: 0.9rem 1.1rem;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast-title {
      font-weight: bold;
      font-size: 0.9rem;
      color: #67e8f9;
      margin-bottom: 0.25rem;
    }

    .toast-body {
      font-size: 0.9rem;
      line-height: 1.35;
    }
  </style>
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="container">
  <div class="card glass">
    <div class="badge">Daily Quote</div>
    <div id="quote" class="quote">Loading...</div>
    <div id="author" class="author"></div>

    <div class="actions">
      <button id="newQuote" class="btn-primary">New Quote</button>
      <button id="saveFav" class="btn-fav">Save Favorite</button>
      <button id="notifyQuote" class="btn-notify">Notify Quote</button>
      <button id="autoNotify" class="btn-notify">Auto Push: Off</button>
    </div>

    <div id="statusMsg" class="status-bar"></div>
  </div>

  <div id="favorites">
    <h2>Favorites</h2>
    <ul id="favList"></ul>
  </div>
</div>

<div id="toast" class="toast glass">
  <div id="toastTitle" class="toast-title">Quote Notification</div>
  <div id="toastBody" class="toast-body"></div>
</div>

<script>
  const quoteEl = document.getElementById('quote');
  const authorEl = document.getElementById('author');
  const newBtn = document.getElementById('newQuote');
  const saveBtn = document.getElementById('saveFav');
  const notifyBtn = document.getElementById('notifyQuote');
  const autoNotifyBtn = document.getElementById('autoNotify');
  const statusMsg = document.getElementById('statusMsg');
  const favList = document.getElementById('favList');
  const toastEl = document.getElementById('toast');
  const toastTitle = document.getElementById('toastTitle');
  const toastBody = document.getElementById('toastBody');

  const STORAGE_KEY = 'dailyQuoteFavs';
  let currentQuote = {};
  let autoTimer = null;
  let toastTimer = null;

  function setStatus(msg) {
    statusMsg.textContent = msg;
  }

  function showToast(title, body) {
    toastTitle.textContent = title;
    toastBody.textContent = body;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      toastEl.classList.remove('show');
    }, 4000);
  }

  async function fetchQuote() {
    quoteEl.textContent = 'Loading...';
    authorEl.textContent = '';
    try {
      const res = await fetch('https://dummyjson.com/quotes/random');
      if (!res.ok) throw new Error('Network error');
      const data = await res.json();
      currentQuote = { quote: data.quote, author: data.author };
      quoteEl.textContent = `"${currentQuote.quote}"`;
      authorEl.textContent = `— ${currentQuote.author}`;
      return currentQuote;
    } catch (err) {
      quoteEl.textContent = 'Failed to load quote. Check your connection and try again.';
      return null;
    }
  }

  async function ensureNotificationPermission() {
    if (!('Notification' in window)) {
      return 'unsupported';
    }
    if (Notification.permission === 'granted') {
      return 'granted';
    }
    if (Notification.permission === 'denied') {
      return 'denied';
    }
    return await Notification.requestPermission();
  }

  async function sendQuoteNotification(fetchFresh = false) {
    const item = fetchFresh || !currentQuote.quote ? await fetchQuote() : currentQuote;
    if (!item || !item.quote) return;

    const text = `"${item.quote}" — ${item.author}`;
    const permission = await ensureNotificationPermission();

    if (permission === 'granted') {
      try {
        new Notification('Daily Quote Push', {
          body: text,
          tag: 'daily-quote-push'
        });
        setStatus('Push quote notification sent.');
        return;
      } catch (e) {
        // Fallback to in-app glass banner
      }
    }

    showToast('Daily Quote Push', text);
    if (permission === 'denied') {
      setStatus('Browser notifications blocked—showed an in-app glass notification instead.');
    } else if (permission === 'unsupported') {
      setStatus('Browser notifications not supported here—showed an in-app glass notification.');
    } else {
      setStatus('Notification permission not granted—showed an in-app glass notification.');
    }
  }

  function getFavorites() {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  }

  function renderFavorites() {
    const favs = getFavorites();
    favList.innerHTML = '';
    favs.forEach((item, index) => {
      const li = document.createElement('li');
      li.className = 'glass';

      const span = document.createElement('span');
      span.className = 'fav-text';
      span.innerHTML = `"${item.quote}" — <strong>${item.author}</strong>`;

      const delBtn = document.createElement('button');
      delBtn.textContent = 'Remove';
      delBtn.className = 'remove-btn';
      delBtn.onclick = () => {
        favs.splice(index, 1);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(favs));
        renderFavorites();
      };

      li.appendChild(span);
      li.appendChild(delBtn);
      favList.appendChild(li);
    });
  }

  saveBtn.addEventListener('click', () => {
    if (!currentQuote.quote) return;
    const favs = getFavorites();
    const exists = favs.some(f => f.quote === currentQuote.quote);
    if (!exists) {
      favs.push(currentQuote);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(favs));
      renderFavorites();
      setStatus('Saved to Favorites.');
    } else {
      setStatus('Already in Favorites.');
    }
  });

  notifyBtn.addEventListener('click', () => {
    sendQuoteNotification(false);
  });

  autoNotifyBtn.addEventListener('click', async () => {
    if (autoTimer) {
      clearInterval(autoTimer);
      autoTimer = null;
      autoNotifyBtn.textContent = 'Auto Push: Off';
      autoNotifyBtn.classList.remove('active');
      setStatus('Auto quote push stopped.');
      return;
    }

    await ensureNotificationPermission();
    autoNotifyBtn.textContent = 'Auto Push: On (60s)';
    autoNotifyBtn.classList.add('active');
    setStatus('Auto quote push enabled (every 60 seconds while open).');

    sendQuoteNotification(true);
    autoTimer = setInterval(() => {
      sendQuoteNotification(true);
    }, 60000);
  });

  newBtn.addEventListener('click', () => {
    fetchQuote();
    setStatus('');
  });

  renderFavorites();
  fetchQuote();
</script>

</body>
</html>
