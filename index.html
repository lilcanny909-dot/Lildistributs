<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Quote</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      padding: 2rem 1rem 3rem;
      color: #ffffff;
      background:
        radial-gradient(circle at 20% 15%, rgba(255, 255, 255, 0.12), transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(255, 255, 255, 0.08), transparent 45%),
        linear-gradient(145deg, #000000 0%, #0a0a0a 50%, #141414 100%);
      background-attachment: fixed;
    }

    .container {
      max-width: 560px;
      margin: 0 auto;
    }

    .glass {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-top-color: rgba(255, 255, 255, 0.32);
      box-shadow:
        0 16px 40px rgba(0, 0, 0, 0.75),
        inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }

    .card {
      border-radius: 16px;
      padding: 1.75rem;
    }

    .label {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: rgba(255, 255, 255, 0.55);
      margin-bottom: 1rem;
    }

    .quote {
      font-size: 1.32rem;
      font-weight: 400;
      line-height: 1.6;
      color: #ffffff;
      margin-bottom: 1.1rem;
    }

    .author {
      font-size: 0.95rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.72);
      text-align: right;
      margin-bottom: 1.6rem;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem;
    }

    button {
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 500;
      padding: 0.58rem 1rem;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      cursor: pointer;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.12s ease;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.4);
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: #ffffff;
      border-color: #ffffff;
      color: #000000;
      font-weight: 600;
    }

    .btn-primary:hover {
      background: #e5e5e5;
      border-color: #e5e5e5;
    }

    .btn-notify.active {
      background: rgba(255, 255, 255, 0.92);
      border-color: #ffffff;
      color: #000000;
      font-weight: 600;
    }

    .status {
      margin-top: 0.9rem;
      font-size: 0.82rem;
      color: rgba(255, 255, 255, 0.6);
      min-height: 1.2em;
    }

    #favorites {
      margin-top: 2.25rem;
    }

    #favorites h2 {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: rgba(255, 255, 255, 0.6);
      margin: 0 0 0.85rem;
    }

    #favorites ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    #favorites li {
      border-radius: 12px;
      padding: 0.9rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .fav-text {
      font-size: 0.92rem;
      line-height: 1.45;
      color: #ffffff;
    }

    .fav-author {
      color: rgba(255, 255, 255, 0.6);
    }

    .remove-btn {
      flex-shrink: 0;
      padding: 0.35rem 0.7rem;
      font-size: 0.78rem;
      color: rgba(255, 255, 255, 0.75);
      border-color: rgba(255, 255, 255, 0.18);
      background: rgba(0, 0, 0, 0.35);
    }

    .remove-btn:hover {
      background: #ffffff;
      border-color: #ffffff;
      color: #000000;
    }

    .toast {
      position: fixed;
      bottom: 1.25rem;
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      opacity: 0;
      pointer-events: none;
      max-width: 92vw;
      width: 440px;
      background: rgba(18, 18, 18, 0.92);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #ffffff;
      border-radius: 12px;
      padding: 0.9rem 1.1rem;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.85);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast-title {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: rgba(255, 255, 255, 0.65);
      margin-bottom: 0.25rem;
    }

    .toast-body {
      font-size: 0.9rem;
      line-height: 1.4;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="card glass">
    <div class="label">Daily Quote</div>
    <div id="quote" class="quote">Loading...</div>
    <div id="author" class="author"></div>

    <div class="actions">
      <button id="newQuote" class="btn-primary">New Quote</button>
      <button id="saveFav">Save Favorite</button>
      <button id="notifyQuote" class="btn-notify">Notify Quote</button>
      <button id="autoNotify" class="btn-notify">Auto Push: Off</button>
    </div>

    <div id="statusMsg" class="status"></div>
  </div>

  <div id="favorites">
    <h2>Favorites</h2>
    <ul id="favList"></ul>
  </div>
</div>

<div id="toast" class="toast">
  <div id="toastTitle" class="toast-title">Daily Quote</div>
  <div id="toastBody" class="toast-body"></div>
</div>

<script>
  const quoteEl = document.getElementById('quote');
  const authorEl = document.getElementById('author');
  const newBtn = document.getElementById('newQuote');
  const saveBtn = document.getElementById('saveFav');
  const notifyBtn = document.getElementById('notifyQuote');
  const autoNotifyBtn = document.getElementById('autoNotify');
  const statusMsg = document.getElementById('statusMsg');
  const favList = document.getElementById('favList');
  const toastEl = document.getElementById('toast');
  const toastTitle = document.getElementById('toastTitle');
  const toastBody = document.getElementById('toastBody');

  const STORAGE_KEY = 'dailyQuoteFavs';
  let currentQuote = {};
  let autoTimer = null;
  let toastTimer = null;

  function setStatus(msg) {
    statusMsg.textContent = msg;
  }

  function showToast(title, body) {
    toastTitle.textContent = title;
    toastBody.textContent = body;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      toastEl.classList.remove('show');
    }, 4000);
  }

  async function fetchQuote() {
    quoteEl.textContent = 'Loading...';
    authorEl.textContent = '';
    try {
      const res = await fetch('https://dummyjson.com/quotes/random');
      if (!res.ok) throw new Error('Network error');
      const data = await res.json();
      currentQuote = { quote: data.quote, author: data.author };
      quoteEl.textContent = `"${currentQuote.quote}"`;
      authorEl.textContent = `— ${currentQuote.author}`;
      return currentQuote;
    } catch (err) {
      quoteEl.textContent = 'Failed to load quote. Check your connection and try again.';
      return null;
    }
  }

  async function ensureNotificationPermission() {
    if (!('Notification' in window)) return 'unsupported';
    if (Notification.permission === 'granted') return 'granted';
    if (Notification.permission === 'denied') return 'denied';
    return await Notification.requestPermission();
  }

  async function sendQuoteNotification(fetchFresh = false) {
    const item = fetchFresh || !currentQuote.quote ? await fetchQuote() : currentQuote;
    if (!item || !item.quote) return;

    const text = `"${item.quote}" — ${item.author}`;
    const permission = await ensureNotificationPermission();

    if (permission === 'granted') {
      try {
        new Notification('Daily Quote', {
          body: text,
          tag: 'daily-quote-push'
        });
        setStatus('Quote notification sent.');
        return;
      } catch (e) {
        // Fallback to toast
      }
    }

    showToast('Daily Quote', text);
    setStatus(
      permission === 'denied'
        ? 'Browser notifications blocked; displayed an in-app alert instead.'
        : 'Displayed an in-app quote alert.'
    );
  }

  function getFavorites() {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  }

  function renderFavorites() {
    const favs = getFavorites();
    favList.innerHTML = '';
    favs.forEach((item, index) => {
      const li = document.createElement('li');
      li.className = 'glass';

      const span = document.createElement('span');
      span.className = 'fav-text';
      span.innerHTML = `"${item.quote}" <span class="fav-author">— ${item.author}</span>`;

      const delBtn = document.createElement('button');
      delBtn.textContent = 'Remove';
      delBtn.className = 'remove-btn';
      delBtn.onclick = () => {
        favs.splice(index, 1);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(favs));
        renderFavorites();
      };

      li.appendChild(span);
      li.appendChild(delBtn);
      favList.appendChild(li);
    });
  }

  saveBtn.addEventListener('click', () => {
    if (!currentQuote.quote) return;
    const favs = getFavorites();
    const exists = favs.some(f => f.quote === currentQuote.quote);
    if (!exists) {
      favs.push(currentQuote);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(favs));
      renderFavorites();
      setStatus('Saved to favorites.');
    } else {
      setStatus('Quote is already in favorites.');
    }
  });

  notifyBtn.addEventListener('click', () => {
    sendQuoteNotification(false);
  });

  autoNotifyBtn.addEventListener('click', async () => {
    if (autoTimer) {
      clearInterval(autoTimer);
      autoTimer = null;
      autoNotifyBtn.textContent = 'Auto Push: Off';
      autoNotifyBtn.classList.remove('active');
      setStatus('Auto push disabled.');
      return;
    }

    await ensureNotificationPermission();
    autoNotifyBtn.textContent = 'Auto Push: On (60s)';
    autoNotifyBtn.classList.add('active');
    setStatus('Auto push enabled every 60 seconds while this tab is open.');

    sendQuoteNotification(true);
    autoTimer = setInterval(() => {
      sendQuoteNotification(true);
    }, 60000);
  });

  newBtn.addEventListener('click', () => {
    fetchQuote();
    setStatus('');
  });

  renderFavorites();
  fetchQuote();
</script>

</body>
</html>
